<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>巧家麵包店｜出貨系統</title>
<!-- 每次改 ../style.css 或這份 style.css，把下面兩個 ?v= 數字都 +1，避免瀏覽器一直用舊的快取版本 -->
<link rel="stylesheet" href="../style.css?v=2" />
<link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

<!-- ========== 密碼保護 ========== -->
<section id="screen-password" class="screen page">
  <div class="brand-header">
    <div class="brand-name">巧家麵包店</div>
    <div class="brand-sub">出貨系統</div>
    <div class="brand-divider"></div>
  </div>
  <div class="field" style="margin-top:24px;">
    <label>請輸入通關密碼</label>
    <input type="password" id="pwd-input" placeholder="密碼" />
  </div>
  <div id="pwd-error" class="alert-note hidden"></div>
  <button id="pwd-submit" class="solid-btn">進入系統</button>
</section>

<!-- ========== 選操作人員 ========== -->
<section id="screen-operator" class="screen page hidden">
  <div class="brand-header">
    <div class="brand-name">巧家麵包店</div>
    <div class="brand-sub">出貨系統</div>
    <div class="brand-divider"></div>
  </div>
  <p style="text-align:center;color:var(--ink-soft);margin-top:20px;">現在是誰在操作？</p>
  <div id="operator-grid" class="operator-grid"></div>
</section>

<!-- ========== 功能選單 ========== -->
<section id="screen-menu" class="screen page hidden">
  <div class="topbar">
    <div id="menu-operator-badge" class="operator-badge"></div>
    <button id="btn-switch-operator" class="ghost-btn" style="margin-left:auto;padding:6px 14px;font-size:12px;">切換操作人</button>
  </div>
  <div class="big-nav">
    <button id="btn-key-order" class="big-btn">
      <span class="icon">✍️</span>
      <div>
        <div class="label">key 訂單</div>
        <div class="desc">手動輸入一張新訂單</div>
      </div>
    </button>
    <button id="btn-daily" class="big-btn">
      <span class="icon">📅</span>
      <div>
        <div class="label">查看每日訂單</div>
        <div class="desc">依日期看每天要出的貨</div>
      </div>
    </button>
    <button id="btn-shipping" class="big-btn">
      <span class="icon">📦</span>
      <div>
        <div class="label">出貨</div>
        <div class="desc">找一張訂單，處理完標記完成</div>
      </div>
    </button>
  </div>
</section>

<!-- ========== key 訂單：品項清單（購物車） ========== -->
<section id="screen-key-order" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1 id="ko-cart-title">key 訂單</h1>
  </div>
  <p style="color:var(--ink-soft);font-size:14px;">建立人：<strong id="ko-cart-operator" style="color:var(--maroon);"></strong></p>
  <div id="ko-cart-list"></div>
  <button id="ko-add-box" class="ghost-btn" style="width:100%;margin:6px 0 18px;">＋ 新增一個禮盒品項</button>

  <div class="combo-summary">
    <div id="ko-cart-total" class="total">目前總金額：$0</div>
    <button id="ko-goto-order-form" class="solid-btn" disabled>填寫訂購資訊，送出訂單</button>
  </div>
</section>

<!-- ========== key 訂單：選禮盒樣式 ========== -->
<section id="screen-ko-box-pick" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1>選禮盒樣式</h1>
  </div>
  <div id="ko-box-grid" class="box-select-grid"></div>
</section>

<!-- ========== key 訂單：填禮盒內容 ========== -->
<section id="screen-ko-box-detail" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1 id="ko-box-detail-title">禮盒內容</h1>
  </div>
  <div id="ko-box-detail-body"></div>

  <div class="flavor-row highlight-gold" id="ko-box-qty-row">
    <span class="fname">這個規格訂購幾盒</span>
    <div class="qty-control">
      <button class="qty-btn" id="ko-box-qty-dec">−</button>
      <input class="qty-num-input" type="number" inputmode="numeric" min="1" step="1" value="1" id="ko-box-qty-input">
      <button class="qty-btn" id="ko-box-qty-inc">＋</button>
    </div>
  </div>

  <div id="ko-box-summary" class="combo-summary">
    <div id="ko-box-remain" class="remain"></div>
    <div id="ko-box-total" class="total">總金額：$0</div>
    <button id="ko-box-add-btn" class="solid-btn" disabled>加入品項清單</button>
  </div>
</section>

<!-- ========== key 訂單：訂購資訊 ========== -->
<section id="screen-ko-order-form" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1 id="ko-form-title">填寫訂購資訊</h1>
  </div>

  <div class="order-recap" id="ko-order-recap"></div>

  <form id="ko-order-form">
    <div class="field">
      <label>建立人</label>
      <input type="text" id="ko-operator" disabled />
    </div>

    <div class="section-title" style="margin-top:0;">取貨方式</div>
    <div class="size-chip-row" id="ko-method-row"></div>

    <div class="field">
      <label>取貨日期</label>
      <input type="date" id="ko-pickup-date" />
    </div>
    <div class="field">
      <label>寄件日期（郵寄才需要）</label>
      <input type="date" id="ko-mail-date" />
    </div>

    <div class="field">
      <label>訂購人姓名</label>
      <input type="text" id="ko-name" />
    </div>
    <div class="field">
      <label>訂購人電話</label>
      <input type="tel" id="ko-phone" />
    </div>
    <div class="field">
      <label>收件人姓名（留空同訂購人）</label>
      <input type="text" id="ko-recipient-name" />
    </div>
    <div class="field">
      <label>收件人電話（留空同訂購人）</label>
      <input type="tel" id="ko-recipient-phone" />
    </div>
    <div class="field">
      <label>收件地址（郵寄才需要）</label>
      <input type="text" id="ko-address" />
    </div>

    <div class="field">
      <label>總金額</label>
      <input type="number" id="ko-total" inputmode="numeric" min="0" step="1" />
    </div>
    <div class="field">
      <label>備註（電話/手寫單的單號也記在這裡）</label>
      <textarea id="ko-note" placeholder="例如：手寫單號 #23、客人特別要求..."></textarea>
    </div>

    <button type="submit" id="ko-submit-btn" class="solid-btn">送出訂單</button>
  </form>

  <div id="ko-result" class="hidden">
    <div class="section-title">✅ 訂單已建立</div>
    <div id="ko-day-summary" class="order-recap"></div>
    <button id="ko-new-order" class="ghost-btn" style="width:100%;margin-top:10px;">再 key 一張</button>
    <button id="ko-back-menu" class="solid-btn" style="margin-top:10px;">回功能選單</button>
  </div>
</section>

<!-- ========== 查看每日訂單（日曆） ========== -->
<section id="screen-daily" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1>查看每日訂單</h1>
    <button id="btn-toggle-view" class="ghost-btn" style="margin-left:auto;padding:6px 14px;font-size:12px;">改用清單顯示</button>
  </div>

  <div id="calendar-view">
    <div class="cal-header">
      <button id="cal-prev" class="back-btn">‹</button>
      <div id="cal-title" class="cal-title"></div>
      <button id="cal-next" class="back-btn">›</button>
    </div>
    <div class="cal-weekdays">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
  </div>

  <div id="list-view" class="hidden"></div>
</section>

<!-- ========== 某一天的訂單列表 ========== -->
<section id="screen-day-detail" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1 id="day-detail-title">當天訂單</h1>
  </div>
  <div id="day-summary" class="order-recap"></div>
  <div id="day-order-list"></div>
</section>

<!-- ========== 訂單詳情（出貨） ========== -->
<section id="screen-order-detail" class="screen page hidden">
  <div class="topbar">
    <button class="back-btn" data-back>‹</button>
    <h1>訂單詳情</h1>
  </div>
  <div id="order-detail-body"></div>
  <button id="order-toggle-status" class="solid-btn" style="margin-top:16px;">標記完成</button>
  <button id="order-edit" class="ghost-btn" style="width:100%;margin-top:10px;">編輯這張訂單</button>
  <button id="order-delete" class="ghost-btn danger-btn" style="width:100%;margin-top:10px;">刪除這張訂單</button>
</section>

<!-- ========== 出貨（找訂單入口，直接沿用查看每日訂單） ========== -->

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
